#Gradle
org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.daemon=true

org.gradle.toolchains.jvm.version=21

#Kotlin
kotlin.code.style=official
ksp.useKSP2=true
kotlin.daemon.jvmargs=-Xmx6G
#kotlin.native.binary.gc=cms
#kotlin.native.binary.smallBinary=true
#skie.kgpVersion=2.2.10

#Flavor: exo-only (no native player library) or full. The default is false (full).
#Override it per build with -PexoOnly=true, for example for reproducible builds:
#./gradlew assembleRelease -PexoOnly=true
exoOnly=false

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.compileSdk=37
android.compileSdkMinor=2
#Pinned for reproducible builds: otherwise AGP picks its default build-tools, which a clean or CI
#checkout can resolve differently. The value must match what AGP resolves.
android.buildToolsVersion=37.0.0
android.minSdk=26
android.targetSdk=37
android.ndkVersion=29.0.14206865
kotlin.incremental.jvm.fir=true

android.uniquePackageNames=false
android.dependency.useConstraints=false
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=true

#The new DSL is on by default since AGP 9.0. This line states it for clarity.
android.newDsl=true
android.builtInKotlin=true

#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.stability.nowarn=true #
#kotlin.mpp.androidSourceSetLayoutVersion=2 is not needed: Kotlin always uses layout v2.
#kotlin.native.cacheKind=none
kotlin.apple.xcodeCompatibility.nowarn=true
#kotlin.native.ignoreDisabledTargets=true

#Compose iOS
org.jetbrains.compose.experimental.uikit.enabled=true

#Kotlin/JS settings, kept in case a Kotlin/JS target is added
org.jetbrains.compose.experimental.jscanvas.enabled=true
kotlin.js.experimental.generateKotlinExternals=true
kotlin.js.yarn=true

# Parallel sync, for Gradle 9.4 and later
org.gradle.tooling.parallel=true
