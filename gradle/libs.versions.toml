[versions] #####################################################
#KMM-Plugins
kotlin = "2.4.20"
ksp = "2.3.11"
agp = "9.3.2"
kiteconfig = "2.0.1"
compose-multiplatform = "1.12.1"
kSerialization = "1.11.0"
detekt = "1.23.8"
kover = "0.9.9"
ktorfit = "2.7.5"
# Runtime language switching. The XML processor reads values-*/strings.xml, so the resource
# files stay the source of truth and translators keep using Weblate.
lyricist = "1.9.0"

#KMM-Libs
compose-multiplatform-icons = "1.7.3"
compose-material3 = "1.12.0-alpha03"
lifecycleViewmodelCompose = "2.11.0"
navigation3Runtime = "1.1.7"
navigation3Ui = "1.1.2"
# Backdrop blur. Haze publishes every target that this project declares. It has no iosX64,
# which this project does not declare either.
haze = "2.0.0-beta03"
kermit = "2.1.0"
krypto = "0.8.0"
datastore = "1.3.0-alpha11"
filekit = "0.15.0"
kolorpicker = "2.1.0"
uriKmp = "0.0.21"
materialkolor = "5.0.1"
ktor = "3.5.2"
koroutines = "1.11.0"
datetime = "0.8.0"
atomicfu = "0.33.0"
# DOM bindings for Kotlin/Wasm. Kotlin/JS gets these from the stdlib; Wasm does not.
kotlinxBrowser = "0.5.0"
coil = "3.6.2"
# Skiko: Compose 1.12.1 ships with 0.150.1, and Coil 3.6.2 declares 0.150.1 too.
# The version is forced to Compose's, so a bump of either library cannot change
# Skiko silently. On an upgrade of compose-multiplatform, set this to the Skiko
# version that the new Compose release ships.
skiko = "0.150.1"

#Android
coreSplashscreen = "1.2.0"
activityCompose = "1.13.0"
documentfile = "1.1.0"
appcompat = "1.8.0"
coreKtx = "1.19.0"
desugaring = "2.1.5"
media3 = "1.11.0"
netty = "4.1.131.Final" # 4.2.x and later need Android API 26 or higher
conscrypt = "2.7.0"
newpipeExtractor = "v0.26.5"

# Resolved from Maven Central. -PuseMavenLocal=true overrides it while a new version is
# published locally but not yet served by Central.
kiteplayer = "0.0.26"
# libmpv for Android. Its artifacts come from a static Maven repository on GitHub Pages, not
# from Central. settings.gradle.kts limits that repository to the libmpvkt modules.
libmpvkt = "0.2.0"

#iOS (VLCKit pod)
libvlc-ios = "4.0.0a19"

#Desktop

[libraries] #######################################################################################
#KMM
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-multiplatform-icons" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "koroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kSerialization" }
logging-kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
compose-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelCompose" }
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3Runtime" }
navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3Ui" }
ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }
ktor-network-tls = { module = "io.ktor:ktor-network-tls", version.ref = "ktor" }
krypto-digest = { module = "org.kotlincrypto.core:digest", version.ref = "krypto" }
krypto-md = { module = "org.kotlincrypto.hash:md", version.ref = "krypto" }
krypto-sha1 = { module = "org.kotlincrypto.hash:sha1", version.ref = "krypto" }
krypto-sha2 = { module = "org.kotlincrypto.hash:sha2", version.ref = "krypto" }
datastore = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
filekit = { module = "io.github.vinceglb:filekit-dialogs-compose", version.ref = "filekit" }
kolorpicker = { module = "com.kborowy:kolor-picker", version.ref = "kolorpicker" }
uriKmp = { module = "com.eygraber:uri-kmp", version.ref = "uriKmp" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
haze-blur = { module = "dev.chrisbanes.haze:haze-blur", version.ref = "haze" }
materialKolor = { module = "com.materialkolor:material-kolor", version.ref = "materialkolor" }
atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-gif = { module = "io.coil-kt.coil3:coil-gif", version.ref = "coil" }
coil-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
# Browser HTTP engine. One artifact serves both Kotlin/JS and Kotlin/Wasm.
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinxBrowser" }
ktorfit = { module = "de.jensklingenberg.ktorfit:ktorfit-lib", version.ref = "ktorfit" }
lyricist = { module = "cafe.adriel.lyricist:lyricist", version.ref = "lyricist" }
lyricist-processor-xml = { module = "cafe.adriel.lyricist:lyricist-processor-xml", version.ref = "lyricist" }
skiko = { module = "org.jetbrains.skiko:skiko", version.ref = "skiko" }

#Android
kotlin-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "koroutines" }
kotlin-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "koroutines" }
kotlin-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "koroutines" }
jetpack-core = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
jetpack-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
jetpack-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
jetpack-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
jetpack-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
desugaring = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugaring" }
m3-exo = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
m3-exo-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
m3-exo-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
m3-exo-rtsp = { module = "androidx.media3:media3-exoplayer-rtsp", version.ref = "media3" }
m3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
m3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
m3-extractor = { module = "androidx.media3:media3-extractor", version.ref = "media3" }
m3-decoder = { module = "androidx.media3:media3-decoder", version.ref = "media3" }
m3-datasource = { module = "androidx.media3:media3-datasource", version.ref = "media3" }
# The lock screen, the notification transport and headset buttons, for every engine.
m3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
m3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
# Only the Netty modules that the client and the built-in server use. netty-all pulls the whole
# family (about forty jars) for the seventeen classes that the code needs: a bootstrap, a channel,
# the codec pair and the TLS context builder.
netty-handler = { module = "io.netty:netty-handler", version.ref = "netty" }
netty-codec = { module = "io.netty:netty-codec", version.ref = "netty" }
netty-transport = { module = "io.netty:netty-transport", version.ref = "netty" }
conscrypt = { module = "org.conscrypt:conscrypt-android", version.ref = "conscrypt" }
kiteplayer-compose = { module = "io.github.yuroyami:kiteplayer-compose", version.ref = "kiteplayer" }
kiteplayer-audioviz = { module = "io.github.yuroyami:kiteplayer-audioviz", version.ref = "kiteplayer" }
libmpvkt = { module = "io.github.yuroyami:libmpvkt", version.ref = "libmpvkt" }
libmpvkt-view = { module = "io.github.yuroyami:libmpvkt-view", version.ref = "libmpvkt" }
newpipe-extractor = { module = "com.github.TeamNewPipe:NewPipeExtractor", version.ref = "newpipeExtractor" }

#Desktop

[bundles] ########################################################################################
compose-multiplatform = [
    "compose-foundation", "compose-ui", "compose-material3",
    "compose-components-resources", "compose-material-icons-extended"
]
ktor = ["ktor-network", "ktor-network-tls"]
media3 = [
    "m3-exo", "m3-exo-dash", "m3-exo-hls", "m3-exo-rtsp", "m3-datasource-okhttp",
    "m3-ui", "m3-extractor", "m3-decoder", "m3-datasource", "m3-common", "m3-session"
]
krypto = ["krypto-digest", "krypto-md", "krypto-sha1", "krypto-sha2"]
haze = ["haze", "haze-blur"]
coil = ["coil-compose", "coil-network-ktor"]
ktor-client = ["ktor-client-core", "ktor-client-content-negotiation", "ktor-serialization-json", "ktor-client-logging"]
navigation3 = ["navigation3-runtime", "navigation3-ui"]
jetpack-androidx-extensions = ["jetpack-activity-compose", "jetpack-appcompat", "jetpack-core", "jetpack-documentfile", "jetpack-splashscreen"]

[plugins] ########################################################################################
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-cocoapods = { id = "org.jetbrains.kotlin.native.cocoapods", version.ref = "kotlin" }

compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-plugin = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }


# Applied at the root: the single source of truth for the app identity, the version and the
# SDK levels.
kiteconfig = { id = "io.github.yuroyami.kiteconfig", version.ref = "kiteconfig" }

android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp"}

kSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktorfit = { id = "de.jensklingenberg.ktorfit", version.ref = "ktorfit" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
