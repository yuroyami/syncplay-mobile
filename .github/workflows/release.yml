name: Release

on:
  workflow_dispatch:
    inputs:
      deploy_play_store:
        description: 'Upload AAB to Google Play'
        type: boolean
        default: true
      play_track:
        description: 'Which Play track to publish to'
        type: choice
        default: beta
        options: [internal, alpha, beta, production]
      deploy_app_store:
        description: 'Upload IPA to App Store / TestFlight'
        type: boolean
        default: true

permissions:
  contents: write

# Every action is pinned to the commit its tag pointed at, with the tag kept as a comment.
# A moving tag is a moving dependency: whoever controls it can change what runs here, and a
# reproducible build cannot depend on something that changes underneath it (issue #105).
env:
  # Skip `brew update` — slow and rarely needed since the macos runner image
  # ships current Homebrew + a recent formula snapshot.
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  # Gradle daemon adds overhead in single-invocation CI steps.
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Android Full Build (exoOnly=false) → 4 ABI APKs + 1 universal + 1 AAB
  # ───────────────────────────────────────────────────────────────────────────
  build-android-full:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      application_id: ${{ steps.version.outputs.application_id }}
      ios_min_version: ${{ steps.version.outputs.ios_min_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      # NDK is ~1GB and rarely changes (pinned in gradle.properties).
      # Skip the install on cache hit.
      - name: Cache Android NDK
        id: ndk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          key: android-ndk-29.0.14206865-${{ runner.os }}

      - name: Install NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;29.0.14206865"

      # Gradle dependency cache + Gradle build cache + wrapper distribution.
      # Saves the dependency-download phase (~2-3 min on cold start).
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # Ask Gradle for the identity rather than re-deriving it. The version code scheme belongs
      # to KiteConfig, and a copy of it in bash can drift without anyone noticing.
      - name: Read release identity
        id: version
        run: |
          ./gradlew -q printReleaseIdentity | tee identity.env
          sed -e 's/^VERSION=/version=/' \
              -e 's/^VERSION_CODE=/version_code=/' \
              -e 's/^APPLICATION_ID=/application_id=/' \
              -e 's/^IOS_MIN_VERSION=/ios_min_version=/' \
              identity.env >> "$GITHUB_OUTPUT"

      # The release is only worth building if the things that gate its upload already hold.
      - name: Verify release gates
        run: ./gradlew qualityGates detekt

      # Native MPV build (FFmpeg, libass, harfbuzz, freetype, mbedtls, dav1d,
      # libplacebo, lua, fribidi, unibreak) cross-compiled for 4 ABIs.
      # When the cache hits, NativeBuildConfig's `onlyIf` short-circuits the
      # Exec task because all output libs are already on disk.
      #
      # Key inputs: every build script under buildscripts/ (depinfo.sh pins
      # dep versions; per-lib scripts in scripts/ control build flags) plus
      # gradle.properties (NDK version) plus the AppConfig lib list.
      - name: Cache MPV native libs
        id: mpv-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: androidApp/src/main/libs
          key: mpv-libs-${{ runner.os }}-${{ hashFiles('buildscripts/mpv_*.sh', 'buildscripts/include/*.sh', 'buildscripts/scripts/*.sh', 'gradle.properties', 'buildSrc/src/main/kotlin/AppConfig.kt') }}

      # Required by the MPV build chain. Skipped entirely when MPV libs are
      # cached — no need to bootstrap the toolchain for a no-op task.
      - name: Install native build dependencies
        if: steps.mpv-cache.outputs.cache-hit != 'true'
        run: brew install automake autoconf libtool pkg-config nasm meson

      - name: Decode keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > keystore/syncplaykey.jks

      - name: Create local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          keystore.keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keystore.keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keystore.storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          yuroyami.keyKlipyApi=${{ secrets.KLIPY_API_KEY }}
          EOF

      - name: Ensure release configuration
        run: |
          # exoOnly must be false for full build
          sed -i '' 's/const val exoOnly = true/const val exoOnly = false/' buildSrc/src/main/kotlin/AppConfig.kt
          # DEBUG must be off
          sed -i '' "s/buildConfigField(\"DEBUG\", true)/buildConfigField(\"DEBUG\", false)/" shared/build.gradle.kts

      # Two Gradle invocations — assembleFullRelease builds the per-ABI APKs
      # (4 splits + 1 universal) with `splits.abi` enabled; bundleFullRelease
      # builds the AAB with splits disabled. Mixing both in one invocation is
      # explicitly unsupported by androidApp/build.gradle.kts (see the comment
      # at `isBuildingBundle`) — splits get switched off and only the universal
      # APK ships, which is the bug that produced a single 115 MB universal in
      # an earlier release. The trade-off is paying configuration twice.
      - name: Build APKs (per-ABI splits + universal)
        run: ./gradlew assembleFullRelease

      - name: Build AAB
        run: ./gradlew bundleFullRelease

      - name: Upload APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-full-apks
          path: androidApp/build/outputs/apk/full/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-aab
          path: androidApp/build/outputs/bundle/fullRelease/*.aab

      # Without these a crash report from a release build is unreadable. They were produced on
      # every build and then thrown away with the runner.
      - name: Upload R8 mapping and native symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-symbols
          if-no-files-found: warn
          path: |
            androidApp/build/outputs/mapping/fullRelease/mapping.txt
            androidApp/build/outputs/native-debug-symbols/fullRelease/native-debug-symbols.zip

  # ───────────────────────────────────────────────────────────────────────────
  # Android ExoOnly Build (exoOnly=true) → 1 universal APK
  # ───────────────────────────────────────────────────────────────────────────
  build-android-exo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Decode keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > keystore/syncplaykey.jks

      - name: Create local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          keystore.keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keystore.keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keystore.storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          yuroyami.keyKlipyApi=${{ secrets.KLIPY_API_KEY }}
          EOF

      - name: Build APK
        # -PexoOnly=true selects the exo-only flavor (overrides the gradle.properties default).
        # That is what creates the `exoOnly` flavor, and therefore the assembleExoOnlyRelease task.
        # Replaces the old sed-the-constant hack, which no longer works now that exoOnly is read
        # from a Gradle property (the property wins over the edited constant).
        run: ./gradlew assembleExoOnlyRelease -PexoOnly=true

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-exo-apk
          path: androidApp/build/outputs/apk/exoOnly/release/*.apk

  # ───────────────────────────────────────────────────────────────────────────
  # Desktop → one installer per host OS. jpackage can only build for the OS it
  # runs on, so this is a matrix rather than one job.
  # ───────────────────────────────────────────────────────────────────────────
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: packageDmg
            artifact: desktop-macos
            path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          - os: windows-latest
            task: packageMsi
            artifact: desktop-windows
            path: desktopApp/build/compose/binaries/main/msi/*.msi
          - os: ubuntu-latest
            task: packageDeb
            artifact: desktop-linux
            path: desktopApp/build/compose/binaries/main/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # Nothing native is downloaded for desktop any more: the only engine is KitePlayer and its
      # decoder rides inside the KiteCodec jar.
      - name: Build installer
        run: ./gradlew :desktopApp:${{ matrix.task }}

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ matrix.path }}

  # ───────────────────────────────────────────────────────────────────────────
  # iOS Build → Archive + IPA + App Store upload
  # ───────────────────────────────────────────────────────────────────────────
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Create local.properties
        run: |
          cat > local.properties <<EOF
          yuroyami.keyKlipyApi=${{ secrets.KLIPY_API_KEY }}
          EOF

      # Stamp the iOS version from the kiteConfig { } block into the Xcode project
      # BEFORE xcodebuild reads it. KiteConfig only rewrites the pbxproj when
      # kiteRewriteXcode is run by hand, so a forgotten run would ship the previous
      # version; stamping here makes CI authoritative regardless of what is committed.
      - name: Stamp iOS version from SSOT
        id: version
        run: |
          VERSION=$(grep -E '^[[:space:]]+version[[:space:]]*=[[:space:]]*"' build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract version from the kiteConfig { } block in build.gradle.kts" >&2
            exit 1
          fi
          VERSION_CODE=$(python3 -c "v='$VERSION'.split('.'); print('1' + v[0].zfill(3) + v[1].zfill(3) + v[2].zfill(2) + '0')")
          PBXPROJ=iosApp/iosApp.xcodeproj/project.pbxproj
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $VERSION;/g" "$PBXPROJ"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $VERSION_CODE;/g" "$PBXPROJ"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "iOS version stamped: $VERSION (build $VERSION_CODE)"

      # CocoaPods caches at three levels:
      # 1. ~/.cocoapods/repos — the trunk spec repo (slow to refresh from CDN)
      # 2. ~/Library/Caches/CocoaPods — downloaded pod sources
      # 3. iosApp/Pods — installed Pods tree, restored as a unit to skip
      #    framework extraction
      #
      # `pod install` always runs (cheap with sources cached) so the generated
      # files inside Pods/ — xcfilelist inputs/outputs, .xcconfig, manifest,
      # Pods.xcodeproj — are regenerated to match the installed CocoaPods/Xcode
      # versions on the runner. Caching `iosApp/Pods` alone and skipping
      # `pod install` is fragile: the cached tree carries over generated
      # artifacts from an older CocoaPods version, and the new Xcode then fails
      # with `Unable to load contents of file list ... .xcfilelist` (which is
      # what blocked the 2026-05-18 release run).
      - name: Cache CocoaPods spec repo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cocoapods/repos
          key: cocoapods-repos-${{ runner.os }}-${{ hashFiles('iosApp/Podfile.lock') }}
          restore-keys: |
            cocoapods-repos-${{ runner.os }}-

      - name: Cache CocoaPods downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-downloads-${{ runner.os }}-${{ hashFiles('iosApp/Podfile.lock') }}
          restore-keys: |
            cocoapods-downloads-${{ runner.os }}-

      - name: Cache installed Pods
        id: pods-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: iosApp/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('iosApp/Podfile.lock') }}

      # KMP needs a dummy framework on disk before CocoaPods can resolve the
      # `:shared` pod dependency. Cheap (~10s) so we run it unconditionally
      # rather than coupling it to the Pods cache.
      - name: Generate shared framework
        run: ./gradlew :shared:generateDummyFramework

      # Always run pod install so the xcfilelist/xcconfig/manifest under
      # iosApp/Pods/Target Support Files match the runner's current CocoaPods
      # version. With sources cached this is ~30s.
      # --repo-update only on cold start — refreshing the spec repo from CDN
      # is the slow part and not needed when the lock hasn't changed.
      - name: Install CocoaPods dependencies
        working-directory: ./iosApp
        run: |
          if [ "${{ steps.pods-cache.outputs.cache-hit }}" = "true" ]; then
            pod install
          else
            pod install --repo-update
          fi

      - name: Setup App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

      - name: Archive
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/iosApp.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8 \
            -authenticationKeyID $APP_STORE_CONNECT_API_KEY_ID \
            -authenticationKeyIssuerID $APP_STORE_CONNECT_ISSUER_ID \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=B5573QN48P \
            clean archive

      - name: Export IPA
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/iosApp.xcarchive \
            -exportOptionsPlist .github/workflows/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/build \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8 \
            -authenticationKeyID $APP_STORE_CONNECT_API_KEY_ID \
            -authenticationKeyIssuerID $APP_STORE_CONNECT_ISSUER_ID

      - name: Upload to App Store
        if: inputs.deploy_app_store
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file $RUNNER_TEMP/build/*.ipa \
            --apiKey $APP_STORE_CONNECT_API_KEY_ID \
            --apiIssuer $APP_STORE_CONNECT_ISSUER_ID \
            --apiPrivateKey ~/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

      - name: Rename IPA
        id: ipa
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IPA_SRC=$(ls $RUNNER_TEMP/build/*.ipa | head -1)
          IPA_NAME="synkplay-${VERSION}-ios.ipa"
          cp "$IPA_SRC" "$RUNNER_TEMP/$IPA_NAME"
          echo "ipa_path=$RUNNER_TEMP/$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "ipa_size=$(stat -f%z "$RUNNER_TEMP/$IPA_NAME")" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-ipa
          path: ${{ steps.ipa.outputs.ipa_path }}

  # ───────────────────────────────────────────────────────────────────────────
  # Create GitHub Release + Upload artifacts + Update AltStore + Play Store
  # ───────────────────────────────────────────────────────────────────────────
  release:
    needs: [build-android-full, build-android-exo, build-desktop, build-ios]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build-android-full.outputs.version }}
      VERSION_CODE: ${{ needs.build-android-full.outputs.version_code }}
      IOS_MIN_VERSION: ${{ needs.build-android-full.outputs.ios_min_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      # ── Google Play Store ──────────────────────────────────────────────────
      - name: Upload AAB to Google Play
        if: inputs.deploy_play_store
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.yuroyami.syncplay
          releaseFiles: artifacts/android-aab/*.aab
          # Was hardcoded to beta while the README told users Play carried the same build.
          track: ${{ inputs.play_track }}
          status: completed
          whatsNewDirectory: fastlane/metadata/android/en-US/changelogs

      # ── GitHub Release ─────────────────────────────────────────────────────
      - name: Collect release files
        run: |
          mkdir -p release-files
          cp artifacts/android-full-apks/*.apk release-files/
          cp artifacts/android-exo-apk/*.apk release-files/
          cp artifacts/ios-ipa/*.ipa release-files/
          # The desktop app has been packageable for a long time and shipped nowhere.
          cp artifacts/desktop-macos/*.dmg release-files/ 2>/dev/null || echo "no macOS installer"
          cp artifacts/desktop-windows/*.msi release-files/ 2>/dev/null || echo "no Windows installer"
          cp artifacts/desktop-linux/*.deb release-files/ 2>/dev/null || echo "no Linux installer"
          echo "Release files:"
          ls -lh release-files/

      # The notes come from CHANGELOG.md, which is written for people who use the app.
      # --generate-notes would list commit subjects instead.
      - name: Extract release notes
        run: |
          awk -v ver="## ${VERSION}" '
            $0 == ver { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}" >&2
            exit 1
          fi
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md \
            release-files/*

      # ── AltStore JSON ──────────────────────────────────────────────────────
      - name: Update AltStore source JSON
        run: |
          IPA_SIZE=$(stat -c%s "release-files/synkplay-${VERSION}-ios.ipa" 2>/dev/null || stat -f%z "release-files/synkplay-${VERSION}-ios.ipa")
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%S+00:00")

          # Both of these were hardcoded empty, so every AltStore entry ever published said
          # nothing about what changed and claimed no minimum iOS version.
          jq --arg ver "$VERSION" \
             --arg code "$VERSION_CODE" \
             --arg size "$IPA_SIZE" \
             --arg date "$DATE" \
             --arg notes "$(cat release-notes.md)" \
             --arg minos "$IOS_MIN_VERSION" \
             --arg url "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/synkplay-${VERSION}-ios.ipa" \
             '
             .apps[0].versions = [{
               downloadURL: $url,
               size: ($size | tonumber),
               version: $ver,
               buildVersion: $code,
               date: $date,
               localizedDescription: $notes,
               minOSVersion: $minos
             }] + .apps[0].versions
             ' altstore_yuroyami.json > altstore_tmp.json && mv altstore_tmp.json altstore_yuroyami.json

      - name: Commit AltStore update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add altstore_yuroyami.json
          git diff --cached --quiet && echo "No AltStore changes" || \
            git commit -m "Update AltStore source for v${VERSION}" && git push
