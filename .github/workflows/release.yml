name: Release

on:
  workflow_dispatch:
    inputs:
      deploy_play_store:
        description: 'Upload AAB to Google Play'
        type: boolean
        default: true
      play_track:
        description: 'Which Play track to publish to'
        type: choice
        default: beta
        options: [internal, alpha, beta, production]
      deploy_app_store:
        description: 'Upload IPA to App Store / TestFlight'
        type: boolean
        default: true
      build_desktop:
        description: 'Build the desktop installers and attach them to the release'
        type: boolean
        default: true

permissions:
  contents: write

# Every action is pinned to the commit that its tag pointed at, with the tag kept as a comment.
# The owner of a tag can move it and change what runs here, and a reproducible build cannot
# depend on something that changes under it (issue #105).
env:
  # Skip `brew update`: it is slow and rarely needed, because the macOS runner image
  # ships a current Homebrew and a recent formula snapshot.
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  KOTLIN_CLI_NO_WELCOME_BANNER: 1

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # One gate for the whole release. Every build waits on it, so nothing reaches a store
  # unless the checks that guard the upload have passed.
  # ───────────────────────────────────────────────────────────────────────────
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Kotlin Toolchain (./kotlin) downloads its own JDKs, Kotlin/Native and Maven artifacts.
      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', '*.module-template.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      # The gates read sources and metadata. They build nothing.
      - name: Verify release gates
        run: |
          # shellcheck disable=SC1010 # `do` is a ./kotlin command here, not the shell keyword.
          ./kotlin do qualityGates
          # shellcheck disable=SC1010
          ./kotlin do detekt

      # The app version is the same on every platform, the Play Store texts fit the limits, and the
      # default strings are the English strings.
      - name: Check the app version, the store metadata and the default strings
        run: ./kotlin check appVersion storeMetadata defaultStrings

  # ───────────────────────────────────────────────────────────────────────────
  # The test suites. Every build waits on them too, so a failing test stops the release before
  # anything is built or uploaded. This job runs on a Mac, because the render harness in the
  # desktop suite measures text, and its limits were set on macOS fonts.
  # ───────────────────────────────────────────────────────────────────────────
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Android host tests compile against the Android SDK.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      # The Kotlin Toolchain (./kotlin) downloads its own JDKs, Kotlin/Native and Maven artifacts.
      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', '*.module-template.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      # The desktop JVM tests of the shared module, with the line coverage floor of app.protocol and
      # app.server. scripts/coverage.py runs the tests with the Kover agent and checks the floor.
      - name: Run the desktop tests and the coverage check
        run: python3 scripts/coverage.py

      # The Android host tests of the shared module.
      - name: Run the Android host tests
        run: ./kotlin test -m shared -p android

      # The licences screen reads a committed file. It must list the libraries that the app ships
      # now. The check runs on the Mac, because it also reads the dependency graph of the iOS code.
      - name: Check the licences file
        run: python3 scripts/licences.py --check

  # ───────────────────────────────────────────────────────────────────────────
  # Android full build → 1 universal APK + 1 AAB
  # ───────────────────────────────────────────────────────────────────────────
  build-android-full:
    needs: [verify, tests]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      application_id: ${{ steps.version.outputs.application_id }}
      ios_min_version: ${{ steps.version.outputs.ios_min_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      # Nothing native is compiled, but the build needs the NDK. The toolchain bundles the Android
      # Gradle plugin 9.3.1, which strips the packaged native libraries with its default NDK,
      # 28.2.13676358. scripts/android_release.py extracts the native debug symbols with the same
      # NDK. The NDK is about 1 GB. A cache hit skips the install.
      - name: Cache Android NDK
        id: ndk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          key: android-ndk-28.2.13676358-${{ runner.os }}

      - name: Install NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;28.2.13676358"

      # The Kotlin Toolchain (./kotlin) downloads its own JDKs, Kotlin/Native and Maven artifacts.
      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', '*.module-template.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      # Ask the build for the identity rather than re-deriving it. The version code scheme belongs
      # to the app-config build plugin, and a copy of it in bash can drift without anyone noticing.
      - name: Read release identity
        id: version
        run: |
          # The toolchain puts `[module][task]` before each line that a build plugin prints.
          # shellcheck disable=SC1010 # `do` is a ./kotlin command here, not the shell keyword.
          ./kotlin do printReleaseIdentity | sed -nE 's/^(\[[^]]*\])* *([A-Z_]+=)/\2/p' | tee identity.env
          sed -e 's/^VERSION=/version=/' \
              -e 's/^VERSION_CODE=/version_code=/' \
              -e 's/^APPLICATION_ID=/application_id=/' \
              -e 's/^IOS_MIN_VERSION=/ios_min_version=/' \
              identity.env >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > keystore/syncplaykey.jks

      # The toolchain signs the release build with keystore.properties at the project root. The
      # storeFile path is relative to androidApp/. scripts/android_release.py reads the same file.
      - name: Create keystore.properties
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          {
            echo "storeFile=../keystore/syncplaykey.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > keystore.properties

      # The script builds the universal APK and the AAB with the toolchain, checks them, and copies
      # them to AndroidAppOutput/. The AAB lets Play serve each phone only its own libraries. The
      # script also writes the R8 mapping and the native debug symbols to AndroidAppOutput/symbols/.
      - name: Build APK and AAB
        run: python3 scripts/android_release.py --full-only

      # libmpvKt ships mpv and FFmpeg stripped. This step adds their symbol files from the
      # libmpvKt release to the native debug symbols. The Play upload sends that file.
      - name: Add the mpv symbols to the native debug symbols
        run: >-
          .github/scripts/add-libmpvkt-symbols.sh
          AndroidAppOutput/synkplay-*-full-universal.apk
          AndroidAppOutput/symbols/native-debug-symbols.zip

      # The release notes carry this table. This job generates it because the release job does not
      # set up the toolchain.
      - name: Write the dependency table for the release notes
        run: |
          # The toolchain puts `[module][task]` before each line that a build plugin prints.
          # shellcheck disable=SC1010 # `do` is a ./kotlin command here, not the shell keyword.
          ./kotlin do printDependencyTable | sed -nE 's/^(\[[^]]*\])* *(\|)/\2/p' | tee dependencies.md

      - name: Upload dependency table
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dependencies
          path: dependencies.md

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-full-apks
          if-no-files-found: error
          path: AndroidAppOutput/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-aab
          if-no-files-found: error
          path: AndroidAppOutput/*.aab

      # Without these files, a crash report from a release build is unreadable. Every build
      # produces them, and the runner discards them unless this step uploads them.
      - name: Upload R8 mapping and native symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-symbols
          if-no-files-found: error
          path: |
            AndroidAppOutput/symbols/mapping.txt
            AndroidAppOutput/symbols/native-debug-symbols.zip

  # ───────────────────────────────────────────────────────────────────────────
  # Android exoOnly build → 1 universal APK
  # ───────────────────────────────────────────────────────────────────────────
  build-android-exo:
    needs: [verify, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      # No NDK step. The exoOnly APK takes its native libraries from the build before the strip
      # step, so the APK is the same with or without an NDK (docs/DEVELOPING.md, "Reproducing a
      # published APK").

      # The Kotlin Toolchain (./kotlin) downloads its own JDKs, Kotlin/Native and Maven artifacts.
      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', '*.module-template.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > keystore/syncplaykey.jks

      # The toolchain signs the release build with keystore.properties at the project root. The
      # storeFile path is relative to androidApp/. scripts/android_release.py reads the same file.
      - name: Create keystore.properties
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          {
            echo "storeFile=../keystore/syncplaykey.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > keystore.properties

      # The script builds the release APK with the exoOnly application ID and
      # KiteBuildConfig.EXOPLAYER_ONLY set to true. Then it writes the APK without the native
      # player libraries, aligned, and signs it again.
      - name: Build APK
        run: python3 scripts/android_release.py --exo-only

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-exo-apk
          if-no-files-found: error
          path: AndroidAppOutput/*.apk

  # ───────────────────────────────────────────────────────────────────────────
  # Desktop → one installer per host OS. jpackage can only build for the OS it
  # runs on, so this is a matrix, not one job. The build_desktop input is on by
  # default. When it is off, the release does not wait on it.
  # ───────────────────────────────────────────────────────────────────────────
  build-desktop:
    if: inputs.build_desktop
    needs: [verify, tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: desktop-macos
            path: build/desktop/desktopApp/*.dmg
          - os: windows-latest
            artifact: desktop-windows
            path: build/desktop/desktopApp/*.msi
          - os: ubuntu-latest
            artifact: desktop-linux
            path: build/desktop/desktopApp/*.deb
    runs-on: ${{ matrix.os }}
    env:
      # A step's condition cannot read a secret, so the job says whether the certificate exists.
      HAS_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One path per runner OS. The cache action skips the paths that do not exist.
      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/Library/Caches/JetBrains/Kotlin
            ~/AppData/Local/JetBrains/Kotlin
          key: kotlin-toolchain-desktop-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', '*.module-template.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-desktop-${{ runner.os }}-

      # jpackage of JDK 21 builds the MSI with WiX 3. The desktop-package build plugin uses the
      # WiX copy on the PATH.
      - name: Install WiX 3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
            $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter 'WiX Toolset v3*' | Select-Object -First 1
            "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      # The macOS app is signed with a Developer ID certificate when the repository has one.
      # Without it, the app has an ad-hoc signature and macOS asks the user to allow it once.
      - name: Import the Developer ID certificate (macOS)
        if: runner.os == 'macOS' && env.HAS_DEVELOPER_ID == 'true'
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          echo -n "$MACOS_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$MACOS_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          read -ra others <<< "$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$keychain" "${others[@]}"
          rm "$RUNNER_TEMP/developer-id.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          test -n "$identity" || { echo "The certificate holds no Developer ID Application identity"; exit 1; }
          echo "SYNKPLAY_MAC_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      # Nothing native is downloaded for desktop: the only engine is KitePlayer, and its
      # decoder ships inside the KiteFFmpeg jar.
      - name: Build installer
        shell: bash
        run: |
          # shellcheck disable=SC1010 # `do` is a ./kotlin command here, not the shell keyword.
          ./kotlin do packageDesktop -m desktopApp

      # Notarization uses the App Store Connect key of the iOS upload. Stapling puts the ticket
      # in the image, so the first open also works offline.
      - name: Notarize the disk image (macOS)
        if: runner.os == 'macOS' && env.SYNKPLAY_MAC_SIGN_IDENTITY != ''
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$key"
          dmg="$(ls build/desktop/desktopApp/*.dmg)"
          xcrun notarytool submit "$dmg" --key "$key" --key-id "$APP_STORE_CONNECT_API_KEY_ID" --issuer "$APP_STORE_CONNECT_ISSUER_ID" --wait
          xcrun stapler staple "$dmg"
          rm "$key"

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ matrix.path }}

  # ───────────────────────────────────────────────────────────────────────────
  # iOS Build → Archive + IPA
  # ───────────────────────────────────────────────────────────────────────────
  build-ios:
    needs: [verify, tests]
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      # The two SwiftNIO handlers of the iOS client have tests of their own, which run on the Mac.
      - name: Test the iOS connection handlers
        run: swift test --package-path iosApp/NioHandlerTests

      # The Kotlin Toolchain (./kotlin) downloads its own JDKs, Kotlin/Native and Maven artifacts.
      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', '*.module-template.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      # The Xcode project holds the iOS version and build number. The verify job checked that
      # they match the app version, and the same values go to the AltStore feed.
      - name: Read the iOS version
        id: version
        run: |
          # The toolchain puts `[module][task]` before each line that a build plugin prints.
          # shellcheck disable=SC1010 # `do` is a ./kotlin command here, not the shell keyword.
          ./kotlin do printReleaseIdentity | sed -nE 's/^(\[[^]]*\])* *([A-Z_]+=)/\2/p' > identity.env
          VERSION=$(sed -n 's/^IOS_VERSION=//p' identity.env)
          VERSION_CODE=$(sed -n 's/^IOS_BUILD_NUMBER=//p' identity.env)
          if [ -z "$VERSION" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::printReleaseIdentity did not provide the iOS release identity" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "iOS version: $VERSION (build $VERSION_CODE)"

      # The vlckit build plugin downloads the VLCKit archive once and keeps it in this folder.
      - name: Read the VLCKit version
        id: vlckit
        run: |
          echo "version=$(sed -n 's/^ *vlcKitVersion: *//p' shared/module.yaml)" >> "$GITHUB_OUTPUT"

      - name: Cache the VLCKit download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Synkplay/VLCKit
          key: vlckit-${{ steps.vlckit.outputs.version }}

      # Xcode links and embeds build/vlckit/VLCKit.xcframework, so it must exist before Xcode
      # plans the build. The Kotlin build phase of the Xcode project builds the shared code.
      - name: Prepare VLCKit
        run: |
          # shellcheck disable=SC1010 # `do` is a ./kotlin command here, not the shell keyword.
          ./kotlin do prepareVlcKit

      - name: Setup App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

      - name: Archive
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild \
            -project iosApp/module.xcodeproj \
            -scheme app \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/iosApp.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8 \
            -authenticationKeyID $APP_STORE_CONNECT_API_KEY_ID \
            -authenticationKeyIssuerID $APP_STORE_CONNECT_ISSUER_ID \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=B5573QN48P \
            clean archive

      - name: Export IPA
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/iosApp.xcarchive \
            -exportOptionsPlist .github/workflows/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/build \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8 \
            -authenticationKeyID $APP_STORE_CONNECT_API_KEY_ID \
            -authenticationKeyIssuerID $APP_STORE_CONNECT_ISSUER_ID

      - name: Rename IPA
        id: ipa
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IPA_SRC=$(ls $RUNNER_TEMP/build/*.ipa | head -1)
          IPA_NAME="synkplay-${VERSION}-ios.ipa"
          cp "$IPA_SRC" "$RUNNER_TEMP/$IPA_NAME"
          echo "ipa_path=$RUNNER_TEMP/$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "ipa_size=$(stat -f%z "$RUNNER_TEMP/$IPA_NAME")" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ipa
          path: ${{ steps.ipa.outputs.ipa_path }}

  # ───────────────────────────────────────────────────────────────────────────
  # Store uploads. Each is its own job, so a store that refuses the build shows
  # on its own line and never stops the GitHub release.
  # ───────────────────────────────────────────────────────────────────────────
  upload-app-store:
    if: inputs.deploy_app_store
    needs: build-ios
    runs-on: macos-latest
    steps:
      - name: Download IPA
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-ipa
          path: ipa

      - name: Setup App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

      - name: Upload to App Store
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file ipa/*.ipa \
            --apiKey $APP_STORE_CONNECT_API_KEY_ID \
            --apiIssuer $APP_STORE_CONNECT_ISSUER_ID \
            --apiPrivateKey ~/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

  upload-play-store:
    if: inputs.deploy_play_store
    needs: build-android-full
    runs-on: ubuntu-latest
    steps:
      # The checkout is for the What's New directory Play reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download AAB
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-aab
          path: aab

      # The AAB carries only the symbols that the build extracted. This file adds mpv's.
      - name: Download native symbols
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-symbols
          path: symbols

      - name: Upload AAB to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.yuroyami.syncplay
          releaseFiles: aab/*.aab
          debugSymbols: symbols/native-debug-symbols.zip
          # An input, not a fixed track: the README says Play carries the same build as GitHub.
          track: ${{ inputs.play_track }}
          status: completed
          whatsNewDirectory: fastlane/metadata/android/en-US/changelogs

  # ───────────────────────────────────────────────────────────────────────────
  # The GitHub release: the files, the notes and the AltStore feed. It waits on
  # the builds only. A skipped desktop build is fine, and it ignores the store uploads.
  # ───────────────────────────────────────────────────────────────────────────
  release:
    needs: [build-android-full, build-android-exo, build-ios, build-desktop]
    if: >-
      ${{ !cancelled()
          && needs.build-android-full.result == 'success'
          && needs.build-android-exo.result == 'success'
          && needs.build-ios.result == 'success'
          && (needs.build-desktop.result == 'success' || needs.build-desktop.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build-android-full.outputs.version }}
      IOS_BUILD_NUMBER: ${{ needs.build-ios.outputs.version_code }}
      IOS_MIN_VERSION: ${{ needs.build-android-full.outputs.ios_min_version }}
    steps:
      # The whole history, because the notes measure the changelog from the previous tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Collect release files
        run: |
          mkdir -p release-files
          cp artifacts/android-full-apks/*.apk release-files/
          cp artifacts/android-exo-apk/*.apk release-files/
          cp artifacts/ios-ipa/*.ipa release-files/
          cp artifacts/desktop-macos/*.dmg release-files/ 2>/dev/null || echo "no macOS installer"
          cp artifacts/desktop-windows/*.msi release-files/ 2>/dev/null || echo "no Windows installer"
          cp artifacts/desktop-linux/*.deb release-files/ 2>/dev/null || echo "no Linux installer"
          echo "Release files:"
          ls -lh release-files/

      # Three sections: the downloads table, the changelog since the previous release in a
      # collapsed block, and the dependency table. CHANGELOG.md is written for people who use
      # the app, while --generate-notes would list commit subjects instead.
      - name: Write the release notes
        run: |
          bash .github/scripts/release-body.sh release-files artifacts/release-dependencies/dependencies.md
          cat release-body.md

      # A re-run of the same version replaces the files and the notes instead of failing on
      # the tag that already exists.
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${VERSION}" --json id >/dev/null 2>&1; then
            echo "Release v${VERSION} exists: replacing its files and notes."
            gh release upload "v${VERSION}" release-files/* --clobber
            gh release edit "v${VERSION}" --title "v${VERSION}" --notes-file release-body.md
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes-file release-body.md \
              release-files/*
          fi

      - name: Update AltStore source JSON
        run: |
          if jq -e --arg ver "$VERSION" 'any(.apps[0].versions[]; .version == $ver)' altstore_yuroyami.json >/dev/null; then
            echo "AltStore feed already lists $VERSION"
            exit 0
          fi
          IPA_SIZE=$(stat -c%s "release-files/synkplay-${VERSION}-ios.ipa" 2>/dev/null || stat -f%z "release-files/synkplay-${VERSION}-ios.ipa")
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%S+00:00")

          # Fill the notes and the minimum iOS version. Without them, an AltStore entry says
          # nothing about what changed and claims no minimum iOS version.
          jq --arg ver "$VERSION" \
             --arg code "$IOS_BUILD_NUMBER" \
             --arg size "$IPA_SIZE" \
             --arg date "$DATE" \
             --arg notes "$(cat release-notes.md)" \
             --arg minos "$IOS_MIN_VERSION" \
             --arg url "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/synkplay-${VERSION}-ios.ipa" \
             '
             .apps[0].versions = [{
               downloadURL: $url,
               size: ($size | tonumber),
               version: $ver,
               buildVersion: $code,
               date: $date,
               localizedDescription: $notes,
               minOSVersion: $minos
             }] + .apps[0].versions
             ' altstore_yuroyami.json > altstore_tmp.json && mv altstore_tmp.json altstore_yuroyami.json

      - name: Commit AltStore update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add altstore_yuroyami.json
          git diff --cached --quiet && echo "No AltStore changes" || \
            git commit -m "Update AltStore source for v${VERSION}" && git push
