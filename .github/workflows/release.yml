name: Release

on:
  workflow_dispatch:
    inputs:
      deploy_play_store:
        description: 'Upload AAB to Google Play'
        type: boolean
        default: true
      play_track:
        description: 'Which Play track to publish to'
        type: choice
        default: beta
        options: [internal, alpha, beta, production]
      deploy_app_store:
        description: 'Upload IPA to App Store / TestFlight'
        type: boolean
        default: true
      build_desktop:
        description: 'Build the desktop installers and attach them to the release'
        type: boolean
        default: false

permissions:
  contents: write

# Every action is pinned to the commit that its tag pointed at, with the tag kept as a comment.
# The owner of a tag can move it and change what runs here, and a reproducible build cannot
# depend on something that changes under it (issue #105).
env:
  # Skip `brew update`: it is slow and rarely needed, because the macOS runner image
  # ships a current Homebrew and a recent formula snapshot.
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  # The Gradle daemon only adds overhead in CI steps that run Gradle once.
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # One gate for the whole release. Every build waits on it, so nothing reaches a store
  # unless the checks that guard the upload have passed.
  # ───────────────────────────────────────────────────────────────────────────
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # `packages` is spelled out because this pinned version asks for `tools` by default. The SDK
      # repository does not serve that package, so sdkmanager would fail the job. Keep the pin:
      # the rule at the top of this file forbids a moving tag.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # The gates read sources and metadata. They do not need the full flavor, and exoOnly
      # configures the Android app without the NDK.
      - name: Verify release gates
        run: ./gradlew qualityGates detekt -PexoOnly=true

  # ───────────────────────────────────────────────────────────────────────────
  # Android full build (exoOnly=false) → 1 universal APK + 1 AAB
  # ───────────────────────────────────────────────────────────────────────────
  build-android-full:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      application_id: ${{ steps.version.outputs.application_id }}
      ios_min_version: ${{ steps.version.outputs.ios_min_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      # AGP needs the NDK to strip packaged libraries and to extract native symbols. Nothing
      # native is compiled. The NDK is about 1 GB, and gradle.properties pins its version.
      # A cache hit skips the install.
      - name: Cache Android NDK
        id: ndk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          key: android-ndk-29.0.14206865-${{ runner.os }}

      - name: Install NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;29.0.14206865"

      # Caches the Gradle dependencies, the Gradle build cache and the wrapper distribution.
      # It saves the dependency download (about 2 to 3 minutes on a cold start).
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # Ask Gradle for the identity rather than re-deriving it. The version code scheme belongs
      # to KiteConfig, and a copy of it in bash can drift without anyone noticing.
      - name: Read release identity
        id: version
        run: |
          ./gradlew -q printReleaseIdentity | tee identity.env
          sed -e 's/^VERSION=/version=/' \
              -e 's/^VERSION_CODE=/version_code=/' \
              -e 's/^APPLICATION_ID=/application_id=/' \
              -e 's/^IOS_MIN_VERSION=/ios_min_version=/' \
              identity.env >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > keystore/syncplaykey.jks

      - name: Create local.properties
        run: |
          cat > local.properties <<EOP
          sdk.dir=$ANDROID_HOME
          keystore.keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keystore.keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keystore.storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOP

      # One Gradle invocation builds both. The full flavor ships one universal APK, and the
      # AAB lets Play serve each phone only its own libraries.
      - name: Build APK and AAB
        run: ./gradlew assembleFullRelease bundleFullRelease

      # The release notes carry this table. This job generates it because this job has the
      # whole build configured, and the release job has no Android SDK.
      - name: Write the dependency table for the release notes
        run: ./gradlew -q printDependencyTable | grep '^|' | tee dependencies.md

      - name: Upload dependency table
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dependencies
          path: dependencies.md

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-full-apks
          path: androidApp/build/outputs/apk/full/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-aab
          path: androidApp/build/outputs/bundle/fullRelease/*.aab

      # Without these files, a crash report from a release build is unreadable. Every build
      # produces them, and the runner discards them unless this step uploads them.
      - name: Upload R8 mapping and native symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-symbols
          if-no-files-found: warn
          path: |
            androidApp/build/outputs/mapping/fullRelease/mapping.txt
            androidApp/build/outputs/native-debug-symbols/fullRelease/native-debug-symbols.zip

  # ───────────────────────────────────────────────────────────────────────────
  # Android ExoOnly Build (exoOnly=true) → 1 universal APK
  # ───────────────────────────────────────────────────────────────────────────
  build-android-exo:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Decode keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > keystore/syncplaykey.jks

      - name: Create local.properties
        run: |
          cat > local.properties <<EOP
          sdk.dir=$ANDROID_HOME
          keystore.keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keystore.keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keystore.storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOP

      - name: Build APK
        # -PexoOnly=true selects the exo-only flavor and overrides the gradle.properties default.
        # The property creates the `exoOnly` flavor, and with it the assembleExoOnlyRelease task.
        # Editing a constant in the source has no effect, because the Gradle property wins.
        run: ./gradlew assembleExoOnlyRelease -PexoOnly=true

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-exo-apk
          path: androidApp/build/outputs/apk/exoOnly/release/*.apk

  # ───────────────────────────────────────────────────────────────────────────
  # Desktop → one installer per host OS. jpackage can only build for the OS it
  # runs on, so this is a matrix, not one job. The build_desktop input turns it
  # on, and it is off by default. When it is off, the release does not wait on it.
  # ───────────────────────────────────────────────────────────────────────────
  build-desktop:
    if: inputs.build_desktop
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: packageDmg
            artifact: desktop-macos
            path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          - os: windows-latest
            task: packageMsi
            artifact: desktop-windows
            path: desktopApp/build/compose/binaries/main/msi/*.msi
          - os: ubuntu-latest
            task: packageDeb
            artifact: desktop-linux
            path: desktopApp/build/compose/binaries/main/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # Nothing native is downloaded for desktop: the only engine is KitePlayer, and its
      # decoder ships inside the KiteFFmpeg jar.
      - name: Build installer
        run: ./gradlew :desktopApp:${{ matrix.task }}

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ matrix.path }}

  # ───────────────────────────────────────────────────────────────────────────
  # iOS Build → Archive + IPA
  # ───────────────────────────────────────────────────────────────────────────
  build-ios:
    needs: verify
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # Let KiteConfig stamp its resolved iOS version and rebuild counter before Xcode
      # reads them. The same model supplies the build number for the AltStore feed.
      - name: Stamp iOS version from SSOT
        id: version
        run: |
          ./gradlew -q kiteApplyIos printReleaseIdentity > identity.env
          VERSION=$(sed -n 's/^IOS_VERSION=//p' identity.env)
          VERSION_CODE=$(sed -n 's/^IOS_BUILD_NUMBER=//p' identity.env)
          if [ -z "$VERSION" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::KiteConfig did not provide the iOS release identity" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "iOS version stamped: $VERSION (build $VERSION_CODE)"

      # CocoaPods caches at three levels:
      # 1. ~/.cocoapods/repos, the trunk spec repo (slow to refresh from CDN)
      # 2. ~/Library/Caches/CocoaPods, downloaded pod sources
      # 3. iosApp/Pods, the installed Pods tree, restored as a unit to skip
      #    framework extraction
      #
      # `pod install` always runs (cheap with sources cached), so the generated
      # files inside Pods/ (xcfilelist inputs and outputs, .xcconfig, manifest,
      # Pods.xcodeproj) match the CocoaPods and Xcode versions on the runner.
      # Do not cache `iosApp/Pods` alone and skip `pod install`: the cached tree
      # carries generated files from an older CocoaPods version, and a newer
      # Xcode then fails with `Unable to load contents of file list ... .xcfilelist`.
      - name: Cache CocoaPods spec repo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cocoapods/repos
          key: cocoapods-repos-${{ runner.os }}-${{ hashFiles('iosApp/Podfile.lock') }}
          restore-keys: |
            cocoapods-repos-${{ runner.os }}-

      - name: Cache CocoaPods downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-downloads-${{ runner.os }}-${{ hashFiles('iosApp/Podfile.lock') }}
          restore-keys: |
            cocoapods-downloads-${{ runner.os }}-

      - name: Cache installed Pods
        id: pods-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: iosApp/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('iosApp/Podfile.lock') }}

      # KMP needs a dummy framework on disk before CocoaPods can resolve the
      # `:shared` pod dependency. The step is cheap (about 10 s), so it always
      # runs instead of depending on the Pods cache.
      - name: Generate shared framework
        run: ./gradlew :shared:generateDummyFramework

      # Always run pod install, so the xcfilelist, xcconfig and manifest under
      # iosApp/Pods/Target Support Files match the runner's CocoaPods version.
      # With sources cached, this takes about 30 s.
      # Use --repo-update only when the Pods cache misses: refreshing the spec
      # repo from the CDN is the slow part, and it is not needed while
      # Podfile.lock is unchanged.
      - name: Install CocoaPods dependencies
        working-directory: ./iosApp
        run: |
          if [ "${{ steps.pods-cache.outputs.cache-hit }}" = "true" ]; then
            pod install
          else
            pod install --repo-update
          fi

      - name: Setup App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

      - name: Archive
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/iosApp.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8 \
            -authenticationKeyID $APP_STORE_CONNECT_API_KEY_ID \
            -authenticationKeyIssuerID $APP_STORE_CONNECT_ISSUER_ID \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=B5573QN48P \
            clean archive

      - name: Export IPA
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/iosApp.xcarchive \
            -exportOptionsPlist .github/workflows/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/build \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8 \
            -authenticationKeyID $APP_STORE_CONNECT_API_KEY_ID \
            -authenticationKeyIssuerID $APP_STORE_CONNECT_ISSUER_ID

      - name: Rename IPA
        id: ipa
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IPA_SRC=$(ls $RUNNER_TEMP/build/*.ipa | head -1)
          IPA_NAME="synkplay-${VERSION}-ios.ipa"
          cp "$IPA_SRC" "$RUNNER_TEMP/$IPA_NAME"
          echo "ipa_path=$RUNNER_TEMP/$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "ipa_size=$(stat -f%z "$RUNNER_TEMP/$IPA_NAME")" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-ipa
          path: ${{ steps.ipa.outputs.ipa_path }}

  # ───────────────────────────────────────────────────────────────────────────
  # Store uploads. Each is its own job, so a store that refuses the build shows
  # on its own line and never stops the GitHub release.
  # ───────────────────────────────────────────────────────────────────────────
  upload-app-store:
    if: inputs.deploy_app_store
    needs: build-ios
    runs-on: macos-latest
    steps:
      - name: Download IPA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ios-ipa
          path: ipa

      - name: Setup App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

      - name: Upload to App Store
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file ipa/*.ipa \
            --apiKey $APP_STORE_CONNECT_API_KEY_ID \
            --apiIssuer $APP_STORE_CONNECT_ISSUER_ID \
            --apiPrivateKey ~/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

  upload-play-store:
    if: inputs.deploy_play_store
    needs: build-android-full
    runs-on: ubuntu-latest
    steps:
      # The checkout is for the What's New directory Play reads.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download AAB
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-aab
          path: aab

      - name: Upload AAB to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.yuroyami.syncplay
          releaseFiles: aab/*.aab
          # An input, not a fixed track: the README says Play carries the same build as GitHub.
          track: ${{ inputs.play_track }}
          status: completed
          whatsNewDirectory: fastlane/metadata/android/en-US/changelogs

  # ───────────────────────────────────────────────────────────────────────────
  # The GitHub release: the files, the notes and the AltStore feed. It waits on
  # the builds only. A skipped desktop build is fine, and it ignores the store uploads.
  # ───────────────────────────────────────────────────────────────────────────
  release:
    needs: [build-android-full, build-android-exo, build-ios, build-desktop]
    if: >-
      ${{ !cancelled()
          && needs.build-android-full.result == 'success'
          && needs.build-android-exo.result == 'success'
          && needs.build-ios.result == 'success'
          && (needs.build-desktop.result == 'success' || needs.build-desktop.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build-android-full.outputs.version }}
      IOS_BUILD_NUMBER: ${{ needs.build-ios.outputs.version_code }}
      IOS_MIN_VERSION: ${{ needs.build-android-full.outputs.ios_min_version }}
    steps:
      # The whole history, because the notes measure the changelog from the previous tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Collect release files
        run: |
          mkdir -p release-files
          cp artifacts/android-full-apks/*.apk release-files/
          cp artifacts/android-exo-apk/*.apk release-files/
          cp artifacts/ios-ipa/*.ipa release-files/
          cp artifacts/desktop-macos/*.dmg release-files/ 2>/dev/null || echo "no macOS installer"
          cp artifacts/desktop-windows/*.msi release-files/ 2>/dev/null || echo "no Windows installer"
          cp artifacts/desktop-linux/*.deb release-files/ 2>/dev/null || echo "no Linux installer"
          echo "Release files:"
          ls -lh release-files/

      # Three sections: the downloads table, the changelog since the previous release in a
      # collapsed block, and the dependency table. CHANGELOG.md is written for people who use
      # the app, while --generate-notes would list commit subjects instead.
      - name: Write the release notes
        run: |
          bash .github/scripts/release-body.sh release-files artifacts/release-dependencies/dependencies.md
          cat release-body.md

      # A re-run of the same version replaces the files and the notes instead of failing on
      # the tag that already exists.
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${VERSION}" --json id >/dev/null 2>&1; then
            echo "Release v${VERSION} exists: replacing its files and notes."
            gh release upload "v${VERSION}" release-files/* --clobber
            gh release edit "v${VERSION}" --title "v${VERSION}" --notes-file release-body.md
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes-file release-body.md \
              release-files/*
          fi

      - name: Update AltStore source JSON
        run: |
          if jq -e --arg ver "$VERSION" 'any(.apps[0].versions[]; .version == $ver)' altstore_yuroyami.json >/dev/null; then
            echo "AltStore feed already lists $VERSION"
            exit 0
          fi
          IPA_SIZE=$(stat -c%s "release-files/synkplay-${VERSION}-ios.ipa" 2>/dev/null || stat -f%z "release-files/synkplay-${VERSION}-ios.ipa")
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%S+00:00")

          # Fill the notes and the minimum iOS version. Without them, an AltStore entry says
          # nothing about what changed and claims no minimum iOS version.
          jq --arg ver "$VERSION" \
             --arg code "$IOS_BUILD_NUMBER" \
             --arg size "$IPA_SIZE" \
             --arg date "$DATE" \
             --arg notes "$(cat release-notes.md)" \
             --arg minos "$IOS_MIN_VERSION" \
             --arg url "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/synkplay-${VERSION}-ios.ipa" \
             '
             .apps[0].versions = [{
               downloadURL: $url,
               size: ($size | tonumber),
               version: $ver,
               buildVersion: $code,
               date: $date,
               localizedDescription: $notes,
               minOSVersion: $minos
             }] + .apps[0].versions
             ' altstore_yuroyami.json > altstore_tmp.json && mv altstore_tmp.json altstore_yuroyami.json

      - name: Commit AltStore update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add altstore_yuroyami.json
          git diff --cached --quiet && echo "No AltStore changes" || \
            git commit -m "Update AltStore source for v${VERSION}" && git push
