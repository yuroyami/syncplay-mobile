# Detekt settings for this codebase.
#
# The build applies this file on top of detekt's default config (buildUponDefaultConfig), so a
# rule that is not named here keeps detekt's default. A rule named here is either switched off
# or kept on because it matches a defect that this repository has had. The rule that inbound
# protocol code throws only SerializationException is not a detekt rule: it is the
# checkProtocolThrows task in buildSrc.

build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

# A rule set or rule with active: false is off. A rule that is not named keeps its default.
comments:
  active: false
complexity:
  active: true
  ComplexCondition:
    active: false
  LongMethod:
    active: true
    threshold: 120
    excludes: ['**/commonTest/**', '**/desktopTest/**', '**/*Screen.kt', '**/ui/**']
  LongParameterList:
    active: false
  TooManyFunctions:
    active: false
  NestedBlockDepth:
    active: false
  CyclomaticComplexMethod:
    active: false
  LargeClass:
    active: false

coroutines:
  active: true
  GlobalCoroutineUsage:
    # No GlobalScope. PlayerManager.invalidate is the one deliberate exception, because
    # teardown must outlive the ViewModel scope that is being cancelled.
    active: true
    excludes: ['**/player/PlayerManager.kt']
  RedundantSuspendModifier:
    active: false
  SuspendFunWithFlowReturnType:
    active: true

empty-blocks:
  active: true
  EmptyCatchBlock:
    active: false      # an empty catch with a comment is a deliberate pattern here
  EmptyFunctionBlock:
    active: false

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false      # engine and transport code catches broadly on purpose
  SwallowedException:
    active: false
  ThrowingExceptionsWithoutMessageOrCause:
    active: false
  PrintStackTrace:
    active: true

naming:
  active: true
  FunctionNaming:
    active: true
    # Composables are PascalCase by convention; tests read as sentences here on purpose.
    ignoreAnnotated: ['Composable']
    excludes: ['**/commonTest/**', '**/desktopTest/**', '**/androidHostTest/**']
    functionPattern: '[a-z][a-zA-Z0-9_]*'
  ConstructorParameterNaming:
    active: false      # names like _name mirror the Python original
  ClassNaming:
    active: true
  VariableNaming:
    active: false      # names like _position mirror the Python original
  TopLevelPropertyNaming:
    active: false
  MatchingDeclarationName:
    active: false
  InvalidPackageDeclaration:
    active: false      # the KMP source layout is not one-package-per-directory

performance:
  active: true
  SpreadOperator:
    active: false
  ForEachOnRange:
    active: false

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: false
  LateinitUsage:
    active: false
  UnreachableCode:
    active: true
  ImplicitDefaultLocale:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  WrongEqualsTypeParameter:
    active: true

style:
  active: true
  NewLineAtEndOfFile:
    active: false      # formatting, not correctness
  LoopWithTooManyJumpStatements:
    active: false
  UseRequire:
    active: false
  UnusedParameter:
    active: false      # overrides and expect/actual pairs carry parameters they do not use
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  MaxLineLength:
    active: false
  WildcardImport:
    active: true
  UnusedImports:
    active: true
  UnusedPrivateMember:
    active: true
    # A @Preview function is called by the IDE, not by any code path.
    ignoreAnnotated: ['Preview']
  UnusedPrivateProperty:
    active: true
  ForbiddenComment:
    active: false
  ThrowsCount:
    active: false
  SerialVersionUIDInSerializableClass:
    active: false
  UseCheckOrError:
    active: false
  DataClassContainsFunctions:
    active: false
